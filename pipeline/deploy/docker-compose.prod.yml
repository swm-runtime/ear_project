# AI 서버 EC2 단일 호스트 구성 (spec/10 2장 "호스트" · M6) — caddy(TLS) → web(Next.js) · worker-io · ai-server(FastAPI).
#   cd /opt/ear/ear_project/pipeline
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/env.prod up -d --build
# env 파일은 점 없는 이름(env.prod·env.ai-server)을 쓴다 — .env* 는 dockerignore·편집 도구 차단 대상
#
# - AWS 자격증명은 인스턴스 역할 `ear-ai-ec2` (IMDSv2 hop limit 2 — 컨테이너가 역할을 읽는 조건)
# - worker 는 기본 IO 전용(EXECUTOR=none) — 구독 토큰을 서버에 두지 않는다 (spec/10 2장). API 키 실행기로 AI 작업까지 집게 하려면
#   env.prod 에 WORKER_EXECUTOR=openai WORKER_CAPABILITIES=ai,io (2026-09-19 API 전환 실험 — 그동안 노트북 워커는 끈다)
# - ai-server(:8000)는 호스트 포트로만 열리고 SG 가 소스를 제품 SG 로 한정한다 — 공개 도메인 없음
name: ear-ai

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PIPELINE_DOMAIN: ${PIPELINE_DOMAIN:?PIPELINE_DOMAIN required}
      PIPELINE_GLOBAL_DOMAIN: ${PIPELINE_GLOBAL_DOMAIN:-admin-global.earcast.co.kr} # 글로벌판 콘솔 (KAN-208)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    build: &pipeline-build
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
        NEXT_PUBLIC_EAR_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_EAR_GOOGLE_CLIENT_ID:-} # 발행 콘솔 구글 로그인 (비밀 아님)
        WORKER_REV: ${WORKER_REV:-unknown}
        WORKER_REV_TS: ${WORKER_REV_TS:-0}
    image: ear-pipeline:prod
    restart: unless-stopped
    environment:
      # 서버 전용 env — NEXT_PUBLIC_* 는 빌드에 박혔다
      PIPELINE_BUCKET: ${PIPELINE_BUCKET:?}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      PIPELINE_WORKER_TOKEN: ${PIPELINE_WORKER_TOKEN:?}
      EAR_API_BASE_URL: ${EAR_API_BASE_URL:-https://api.earcast.co.kr/api/v1} # 발행 프록시(/api/ear) 대상
      EAR_SSO_SECRET: ${EAR_SSO_SECRET:-} # 발행 콘솔 SSO(/api/ear/sso) — 값은 서버 env.prod 에만(커밋 금지). 미설정이면 그 라우트만 500, 배포는 안 깨진다
      EAR_DEV_API_BASE_URL: ${EAR_DEV_API_BASE_URL:-https://api-dev.earcast.co.kr/api/v1} # 추천 테스트 프록시(/api/ear-dev) 대상 — 개발계
      EAR_DEV_SSO_SECRET: ${EAR_DEV_SSO_SECRET:-} # 개발계 SSO(/api/ear-dev/sso) — 개발계 서버의 PIPELINE_SSO_SECRET 과 같은 값. 미설정이면 추천 테스트 탭만 연결 실패
      # 대본 임베딩 보완 (metadata-pipeline 4.3): 발행 시 enrichment.json 에 임베딩이 없으면 같은 compose 의 AI 서버에서 받아 합친다. 토큰 = env.ai-server 의 INTERNAL_AUTH_TOKEN
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8000}
      AI_SERVER_TOKEN: ${AI_SERVER_TOKEN:-}
    expose:
      - '3000'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  worker-io:
    build: *pipeline-build
    image: ear-pipeline:prod
    restart: unless-stopped
    command: ['npm', 'run', 'worker']
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      EXECUTOR: ${WORKER_EXECUTOR:-none}       # none(IO 전용, 기본) · openai(AI 단계를 OpenAI API 로 — env.prod, 2026-09-19)
      CAPABILITIES: ${WORKER_CAPABILITIES:-io} # io(기본) · ai,io(AI 작업까지 — EXECUTOR 가 none 이면 무시된다)
      # API 실행기일 때의 단계 모델·effort — 비우면 코드 기본값(config.ts). claude 모델 이름은 OpenAI 실행기가 동급 GPT 로 사상한다
      DRAFT_DESIGN_MODEL: ${DRAFT_DESIGN_MODEL:-}
      DRAFT_WRITE_MODEL: ${DRAFT_WRITE_MODEL:-}
      REVISION_MODEL: ${REVISION_MODEL:-}
      QA_MODEL: ${QA_MODEL:-}
      CRITIC_MODEL: ${CRITIC_MODEL:-}
      AXIS_CHECK_MODEL: ${AXIS_CHECK_MODEL:-}
      CLUSTER_MODEL: ${CLUSTER_MODEL:-}
      ENRICH_MODEL: ${ENRICH_MODEL:-}
      ENRICH_TAGS: ${ENRICH_TAGS:-} # 1 = enrichment.json 에 해시태그를 싣고 형식 3(KAN-164). 콘솔 ENRICHMENT_SCHEMA_VERSION_FALLBACK 과 함께 움직인다
      EFFORT_DESIGN: ${EFFORT_DESIGN:-}
      EFFORT_WRITE: ${EFFORT_WRITE:-}
      EFFORT_REVISION: ${EFFORT_REVISION:-}
      EFFORT_QA: ${EFFORT_QA:-}
      EFFORT_QA_RECHECK: ${EFFORT_QA_RECHECK:-}
      EFFORT_CRITIC: ${EFFORT_CRITIC:-}
      OPENAI_MODEL_OPUS: ${OPENAI_MODEL_OPUS:-}
      OPENAI_MODEL_SONNET: ${OPENAI_MODEL_SONNET:-}
      OPENAI_MODEL_FABLE: ${OPENAI_MODEL_FABLE:-}
      OPENAI_VERBOSITY: ${OPENAI_VERBOSITY:-}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-}
      ASSET_PROFILE: ${ASSET_PROFILE:-} # 비우면 실행기가 openai 일 때 gpt(guidelines.gpt.md 사용), 아니면 default (spec/10 3.2)
      WORKER_NAME: ${WORKER_NAME:-ai-server-io}
      WORK_ROOT: /work # S3 캐시. AI 실행기일 땐 규칙 자산 번들(DB prompt_assets)도 여기 assets/<해시>/ 로 내려놓는다
      ASSET_ROOT: /srv/docs/ai # 규칙 자산 git 사본(마운트) — 배포 시 assets:import 가 여기서 읽는다 (2026-09-12)
      PIPELINE_BUCKET: ${PIPELINE_BUCKET:?}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_MODE: direct
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-} # TTS (M5) — env.prod 에 보관된 키
      # 대본 임베딩 (metadata-pipeline 4.3 Phase B) — 메타 부여(enrich) 때 AI 서버 /embeddings 를 부른다. 토큰 = env.ai-server 의 INTERNAL_AUTH_TOKEN
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8000}
      AI_SERVER_TOKEN: ${AI_SERVER_TOKEN:-}
      # 썸네일 (KAN-50) — OpenAI 이미지 API. 키가 없으면 워커가 thumbnail 작업을 집지 않고 큐에 남긴다(0018)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      THUMBNAIL_MODEL: ${THUMBNAIL_MODEL:-}
      THUMBNAIL_QUALITY: ${THUMBNAIL_QUALITY:-}
      THUMBNAIL_ANCHOR_KEY: ${THUMBNAIL_ANCHOR_KEY:-}
      # 백엔드 ERROR → Slack (worker log-watch) — 비우면 꺼짐. 인스턴스 롤(ear-logs-read)로 CloudWatch 를 읽는다
      SLACK_ERROR_WEBHOOK_URL: ${SLACK_ERROR_WEBHOOK_URL:-}
      PIPELINE_CONSOLE_URL: ${PIPELINE_CONSOLE_URL:-}    # 자동화 알림의 콘솔 링크 (notify.ts) — 비우면 기본값
      PIPELINE_DOMAIN: ${PIPELINE_DOMAIN:-}
    volumes:
      - worker-work:/work
      - ../../docs/ai:/srv/docs/ai:ro # push.sh 가 rsync 한 docs/ai (활성화 자동화)
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  # ── 글로벌판 인스턴스 (KAN-208 · docs/ai/global/PIPELINE.md 4.2·8장) ─────────────────────────────
  # 같은 이미지·같은 코드를 PIPELINE_LOCALE=en 으로 띄운다. DB·버킷·진행자 이름은 deploy/env.global(서버에만, 커밋 금지)에서 온다.
  # profiles: push.sh 가 서버의 deploy/env.global 이 비어 있지 않을 때만 --profile global 로 띄운다 — 없으면 한국판만(종전 그대로).
  # environment 는 env_file 보다 우선한다 — 한국판과 공유하는 값(API 키·발행 SSO·AI 서버)만 여기서 env.prod 로 채우고, 인스턴스 값은 env.global 에만 둔다.
  web-global:
    image: ear-pipeline:prod # web 이 빌드한 이미지를 그대로 — Supabase 접속값은 실행 시점 env(SUPABASE_URL·SUPABASE_ANON_KEY)로 받는다
    pull_policy: never
    profiles: ['global']
    restart: unless-stopped
    env_file: env.global # SUPABASE_URL · SUPABASE_ANON_KEY · PIPELINE_BUCKET · PIPELINE_SPEAKERS · PIPELINE_WORKER_TOKEN
    environment:
      PIPELINE_LOCALE: en
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      EAR_API_BASE_URL: ${EAR_API_BASE_URL:-https://api.earcast.co.kr/api/v1} # 발행처는 한국판과 같은 제품 서버 (market=global)
      EAR_SSO_SECRET: ${EAR_SSO_SECRET:-}
      EAR_DEV_API_BASE_URL: ${EAR_DEV_API_BASE_URL:-https://api-dev.earcast.co.kr/api/v1}
      EAR_DEV_SSO_SECRET: ${EAR_DEV_SSO_SECRET:-}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8000}
      AI_SERVER_TOKEN: ${AI_SERVER_TOKEN:-}
    expose:
      - '3000'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  worker-global:
    image: ear-pipeline:prod
    pull_policy: never
    profiles: ['global']
    restart: unless-stopped
    command: ['npm', 'run', 'worker']
    env_file: env.global # DATABASE_URL(Session pooler) · PIPELINE_BUCKET · PIPELINE_SPEAKERS · TTS_VOICE_A · TTS_VOICE_B · PIPELINE_CONSOLE_URL
    environment:
      PIPELINE_LOCALE: en
      EXECUTOR: openai # 글로벌판은 노트북 워커 없이 서버 API 실행기만 (글로벌 명세 4.4)
      CAPABILITIES: ai,io
      WORKER_NAME: ai-server-global
      WORK_ROOT: /work
      ASSET_ROOT: /srv/docs/ai/global # 명세 장 원본 — 글로벌 명세 4.1
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_MODE: direct
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-} # 계정 공유 — 한도는 두 인스턴스 합산 (KAN-204)
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai-server:8000}
      AI_SERVER_TOKEN: ${AI_SERVER_TOKEN:-}
      SLACK_ERROR_WEBHOOK_URL: ${SLACK_ERROR_WEBHOOK_URL:-} # 알림은 [GLOBAL] 머리로, 백엔드 로그 감시는 en 에서 돌지 않는다
    volumes:
      - worker-global-work:/work
      - ../../docs/ai:/srv/docs/ai:ro
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  ai-server:
    build:
      context: ../../ai-server
    restart: unless-stopped
    env_file: env.ai-server # ai-server/.env.example 기준 (INTERNAL_AUTH_TOKEN·EMBEDDING_* — 커밋 금지)
    ports:
      - '8000:8000' # SG 가 소스를 제품 SG·로컬(SSH 터널은 localhost)로 한정한다
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  caddy-data:
  caddy-config:
  worker-work:
  worker-global-work:
