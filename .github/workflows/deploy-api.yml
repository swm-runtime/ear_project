name: deploy-api
# backend/ 변경을 검증하고, 브랜치에 따라 배포한다 (KAN-62 6·4-4단계, 2026-09-16 전환):
#   dev  머지 → 개발계 (GitHub Environment api-dev)
#   main 머지 → 운영   (GitHub Environment api-prod) + 태그 v<앱 버전>[+배포 순번]
# 버전의 기준은 frontend/app.json 의 expo.version(스토어 버전)이다. 백엔드는 따로 올리지 않고 앱을 따른다 (2026-09-17).
# 서버는 더 이상 빌드하지 않는다 — build-push 가 ECR 에 올린 커밋 SHA 이미지를 push.sh 가 pull 한다.
# 검증(verify)과 배포(deploy)를 job 으로 나눈다 — 검증이 실패하면 SG 개폐·SSH 자체가 일어나지 않는다.
# PR 에서는 검증 + "원본 브랜치 확인" 만 돈다. AWS 접근은 OIDC 역할 ear-ci-deploy — 저장된 AWS 키 없음.
#   신뢰 sub: 브랜치(refs/heads/dev·main — verify·build-push) + environment:api-dev·api-prod(deploy — environment: 가 있는 job 은 sub 형식이 바뀐다).
# 환경별 값(호스트·SG·Secrets 경로·헬스 URL)은 Environment 변수 vars.API_* 에, SSH 키는 secret CI_SSH_KEY_API 에 있다
# (api-dev 는 환경 시크릿 = 개발계 키, api-prod 는 레포 시크릿 = 운영 키). 1회 설정: backend/deploy/aws/setup-ci.sh · setup-ci-envs.sh

on:
  # 머지 전에 막는다 — push 만 있으면 이미 브랜치에 들어온 뒤에야 안다.
  #
  # **paths 필터를 두지 않는다.** 필수 상태 체크로 걸려면 검증 job 이 **모든 PR 에서 결론을
  # 보고해야** 한다 — GitHub 은 실행되지 않은 필수 체크를 영원히 pending 으로 보므로, 필터를
  # 두면 FE·문서 PR 이 전부 머지 불가가 된다. 대신 job 안에서 백엔드 변경 여부를 판정해
  # 관계없는 PR 은 단계를 건너뛰고 성공으로 끝낸다 (tickets/infra 의 A 안).
  pull_request:
  push:
    branches: [dev, main]
    paths: ['backend/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  # dev push 는 종전대로 한 줄로 직렬화된다(같은 group). PR 은 ref 별로 갈라져 배포를 막지 않는다
  group: deploy-api-${{ github.event.pull_request.number || github.ref }}
  # 배포는 중간에 끊지 않는다. PR 검증만 새 커밋이 오면 앞선 런을 접는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 배포 전 관문 — lint·build·유닛·e2e. CI_SSH_KEY_API guard 와 무관하게 항상 돈다
  # (배포하지 않는 저장소에서도 테스트는 의미가 있다).
  #
  # **이 job 의 name 이 곧 필수 상태 체크 이름이다.** 바꾸면 dev 브랜치 보호의 체크 목록이
  # 끊어져 모든 PR 이 pending 에 걸린다 — 바꿀 때는 보호 설정도 같이 갱신할 것.
  verify:
    name: 검증 (lint · build · 유닛 · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # 변경 파일 목록 조회(GET /pulls/{n}/files) 에만 쓴다
      pull-requests: read

    services:
      # 로컬 docker-compose.yml 과 같은 이미지 — 표준 postgres 에는 vector 확장이 없어
      # AddEmbeddingVectors 마이그레이션이 실패한다.
      # 값·포트는 .env.example 기본값에 맞춘다(그대로 복사해 쓰기 위해). 운영 DB 가 아니다.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ear
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: runtime
          TZ: UTC
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ear -d runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      # 판정보다 앞에 둔다 — defaults 의 working-directory(backend) 가 이 시점에 있어야 한다
      - uses: actions/checkout@v4

      # 서버 스크립트 실행 권한. **백엔드 변경 판정과 무관하게 항상 돈다**(git 조회 한 번이라 싸다).
      #
      # 배포(push.sh)가 `git archive | tar -x` 로 서버 파일을 **git 에 기록된 모드 그대로** 덮어쓴다.
      # 그래서 git 에 644 로 들어간 스크립트는 서버에서 chmod 해도 다음 배포에 되돌아가고, 크론이
      # 경로로 직접 부르면 Permission denied 로 **아예 돌지 않는다.** 손으로 `bash x.sh` 로 테스트하면
      # 실행 권한이 필요 없어 통과하므로 테스트로는 안 잡힌다. 같은 사고가 세 번 났다:
      #   backup.sh (2026-08-31~09-11, 11일 백업 없음) · sync-content-export.sh · ebs-snapshot.sh
      #   (2026-09-15 추가 후 크론으로 한 번도 안 돎 — 스냅샷·개발계 콘텐츠 동기화 이틀 공백)
      #
      # 크론 대상만 골라 검사하지 않고 **deploy/ 바로 아래 .sh 전부**를 본다 — 새 크론이 생길 때
      # 목록 갱신을 잊으면 같은 구멍이 난다. aws/ 아래 설정 스크립트는 사람이 `bash` 로 부르므로 제외.
      # `:(glob)` 필수 — git pathspec 의 기본 `*` 는 `/` 를 넘어 aws/ 까지 잡는다(7개가 아니라 16개).
      - name: 서버 스크립트 실행 권한
        run: |
          BAD=$(git ls-files -s ':(glob)deploy/*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$BAD" ]; then
            echo "::error::실행 권한 없이 커밋된 서버 스크립트 — 크론이 Permission denied 로 돌지 않는다:"
            echo "$BAD" | sed 's/^/  backend\//'
            echo "고치기: git update-index --chmod=+x backend/<파일>"
            exit 1
          fi
          echo "ok: backend/deploy/*.sh 전부 100755"

      # 트리거에서 뗀 paths 필터를 여기서 대신한다. 관계없는 PR 도 job 자체는 뜨고,
      # 아래 단계를 전부 건너뛴 채 **success 로 결론을 보고한다**.
      #
      # push·workflow_dispatch 는 판정하지 않는다 — push 트리거의 paths 필터가 이미
      # 걸러 주고, 여기서 false 가 나오면 needs: verify 인 배포 job 이 같이 죽는다.
      - name: 백엔드 변경 여부 판정
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          if printf '%s\n' "$FILES" | grep -qE '^(backend/|\.github/workflows/deploy-api\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ 변경이 없다 — 검증 단계를 건너뛰고 성공으로 보고한다"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.backend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 의존성 설치
        if: steps.scope.outputs.backend == 'true'
        run: npm ci

      # 운영 시크릿을 쓰지 않는다 — 예제의 더미 값으로 충분하다(AUDIO_DELIVERY=local,
      # MAIL_DELIVERY=logging 이라 외부 자원에 붙지 않는다). 예제를 그대로 복사해도
      # 기동되도록 맞춰 두었다(2026-09-08). 유닛 테스트도 env 를 읽으므로 앞에 둔다.
      - name: 테스트 env 준비 (.env.example 그대로)
        if: steps.scope.outputs.backend == 'true'
        run: cp .env.example .env

      - name: lint
        if: steps.scope.outputs.backend == 'true'
        run: npm run lint

      - name: build
        if: steps.scope.outputs.backend == 'true'
        run: npm run build

      - name: 유닛 테스트
        if: steps.scope.outputs.backend == 'true'
        run: npm test

      # 로컬과 같은 순서 — 스키마가 없으면 e2e 가 전부 깨진다
      - name: 마이그레이션
        if: steps.scope.outputs.backend == 'true'
        run: npm run migration:run

      - name: e2e 테스트
        if: steps.scope.outputs.backend == 'true'
        run: npm run test:e2e

  # main 으로의 PR 은 dev 에서만 — main 보호 규칙의 필수 체크다(setup-main-protection.sh).
  # **이 job 의 name 도 필수 상태 체크 이름이다.** 바꾸면 main 보호 설정도 같이 갱신할 것.
  # dev 로의 PR 에서도 돌지만 항상 통과한다(결론을 보고해야 pending 에 걸리지 않는다).
  source-check:
    name: 원본 브랜치 확인 (dev)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: main 으로의 PR 은 head 가 dev 여야 한다
        run: |
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::main 으로의 PR 은 dev 브랜치에서만 연다 (현재 head: ${{ github.head_ref }}). 운영 반영 흐름: 작업 브랜치 → dev → main"
            exit 1
          fi
          echo "ok: base=${{ github.base_ref }} head=${{ github.head_ref }}"

      # 앱·백엔드 버전 일치 — main 으로 나가기 전에 막는다. 태그 번호의 기준이 앱 버전인데 백엔드
      # package.json 이 다르면, 배포 기록(태그)과 코드가 가리키는 버전이 어긋난다. 한쪽만 올리는
      # 실수를 사람이 기억할 필요가 없게 여기서 잡는다. 새 job 이 아니라 이 job 안에 두는 이유는
      # job 이름이 main 보호의 필수 체크라서다 — 새 job 은 보호 설정 변경 없이는 강제되지 않는다.
      #
      # **dev 로의 PR 에서도 검사한다.** main 으로의 PR 에서만 보면, 앱 버전만 올린 PR 이 dev 에 들어가
      # 한동안 어긋난 채로 있다가 릴리스 PR 에서야 막히고, 고치려면 dev 로 PR 을 또 열어야 한다.
      # dev 가 일치 상태이면 무관한 PR 은 항상 통과한다 — 한쪽만 올린 PR 만 걸린다.
      - uses: actions/checkout@v4
      - name: 앱·백엔드 버전 일치
        run: |
          APP=$(node -p "require('./frontend/app.json').expo.version")
          BE=$(node -p "require('./backend/package.json').version")
          if [ "$APP" != "$BE" ]; then
            echo "::error::버전 불일치 — 앱(frontend/app.json) $APP · 백엔드(backend/package.json) $BE. 버전의 기준은 앱이다: backend/package.json 의 version 을 $APP 로 맞춘다"
            exit 1
          fi
          echo "ok: 앱·백엔드 모두 $APP"

  build-push:
    name: 이미지 빌드 → ECR
    # 검증을 통과한 커밋만 이미지가 된다. 배포 job 이 이 이미지를 서버에서 pull 한다(4-4 전환, 2026-09-16).
    # 태그: 커밋 SHA(불변 — 롤백은 이전 SHA 로 push.sh) + <브랜치>-latest(이동).
    needs: verify
    if: github.event_name != 'pull_request'
    # 공개 저장소라 GitHub arm64 러너가 무료다 — 서버(t4g, arm64)와 같은 아키텍처를 네이티브로 빌드한다.
    # 저장소를 비공개로 바꾸면: (a) 그대로 두면 분 단위 과금(무료 2,000분/월 안에 대개 들어온다) 또는
    # (b) runs-on 을 ubuntu-latest 로 바꾸고 docker/setup-qemu-action 을 앞에 넣어 에뮬레이션(빌드 2~3배 느림).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: AWS 자격 (OIDC — dev·main 브랜치 신뢰, ecr-push 인라인 정책)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::639177726357:role/ear-ci-deploy
          aws-region: ap-northeast-2
      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: 태그 결정 — 커밋 SHA(불변) + 브랜치 이동 태그
        id: meta
        run: |
          REG="${{ steps.ecr.outputs.registry }}"
          echo "image=$REG/ear/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "moving=$REG/ear/api:${GITHUB_REF_NAME}-latest" >> "$GITHUB_OUTPUT"
      - name: 빌드 (arm64 네이티브 — Dockerfile 그대로)
        working-directory: backend
        run: docker build -t "${{ steps.meta.outputs.image }}" -t "${{ steps.meta.outputs.moving }}" .
      - name: 푸시
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.moving }}"
          echo "::notice::pushed ${{ steps.meta.outputs.image }}"

  deploy:
    name: 배포 (EC2)
    # 검증 통과 + 이미지가 있을 때만 배포한다
    needs: [verify, build-push]
    # PR 이벤트에서는 SG 개폐·SSH 가 일어나지 않는다. dev·main push·수동 실행에서만 배포한다
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 브랜치 → 환경. Environment 의 배포 브랜치 정책이 dev→api-dev, main→api-prod 만 허용한다(setup-ci-envs.sh)
    environment: ${{ github.ref_name == 'main' && 'api-prod' || 'api-dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      API_HOST: ${{ vars.API_HOST }}
      API_SG_ID: ${{ vars.API_SG_ID }}
      API_SECRET_ID: ${{ vars.API_SECRET_ID }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
      API_IMAGE: ${{ needs.build-push.outputs.image }}
    steps:
      # 1회 설정(setup-ci.sh · setup-ci-envs.sh)이 아직이면 조용히 건너뛴다
      - name: 설정 여부 확인
        id: guard
        run: |
          if [ -z "${{ secrets.CI_SSH_KEY_API }}" ] || [ -z "$API_HOST" ] || [ -z "$API_SG_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_SSH_KEY_API 또는 Environment 변수(API_HOST·API_SG_ID)가 없다 — 이 환경의 자동 배포가 아직 켜지지 않았다. setup-ci-envs.sh 를 실행할 것"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::환경 ${{ github.ref_name == 'main' && 'api-prod' || 'api-dev' }} → $API_HOST · 이미지 $API_IMAGE"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - name: AWS 자격 (OIDC — dev·main 브랜치 신뢰)
        if: steps.guard.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::639177726357:role/ear-ci-deploy
          aws-region: ap-northeast-2

      - name: SSH 개방 — 러너 IP 를 이 환경의 SG 에 잠깐 추가
        id: sg
        if: steps.guard.outputs.ready == 'true'
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$API_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=\"github-actions deploy\"}]" \
            || echo "(이미 열려 있음)"

      - name: 배포 (push.sh — 코드 반입 + Secrets 적용 + ECR 이미지 pull·재기동 + 헬스 확인)
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CI_SSH_KEY_API }}" > ~/.ssh/ci_deploy_api
          chmod 600 ~/.ssh/ci_deploy_api
          # REF 를 넘기지 않는다 — 러너가 체크아웃한 HEAD 를 그대로 뜬다. API_IMAGE 가 있으므로 서버는 빌드하지 않고 pull 한다
          HOST="$API_HOST" SECRET_ID="$API_SECRET_ID" HEALTH_URL="$API_HEALTH_URL" API_IMAGE="$API_IMAGE" \
            PEM=~/.ssh/ci_deploy_api bash backend/deploy/push.sh

      - name: 실패 시 최근 로그 — 원인을 런에서 바로 본다
        if: failure()
        run: aws logs tail "${{ vars.LOG_GROUP_PREFIX || '/ear' }}/api" --since 10m --format short || echo "(로그 조회 실패 — 역할에 logs 읽기 권한이 없다)"

      - name: SSH 폐쇄 — 러너 IP 제거 (배포 실패해도 실행)
        if: always() && steps.sg.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$API_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.sg.outputs.ip }}/32}]" \
            || true

  # main 배포가 끝나면 그 커밋에 버전 태그를 붙인다(결정 5: release 브랜치 없이 main = 운영 배포 + 태그).
  #
  # **번호의 기준은 앱 버전(frontend/app.json expo.version)이다** (2026-09-17 개정). 종전에는 백엔드
  # package.json 이 기준이라 머지마다 올렸는데, 백엔드는 자주·앱은 스토어 심사 때문에 드물게 나가서
  # "v1.0.5" 태그가 존재하지 않는 앱 버전을 가리켰다. 이제:
  #   v1.0.0     그 앱 버전 시기의 첫 운영 배포
  #   v1.0.0+2   같은 앱 버전에서 백엔드만 두 번째 배포 (+N 은 SemVer 빌드 메타데이터 — "같은 버전의 다른 빌드")
  #   v1.1.0     앱이 1.1.0 으로 올라간 뒤 첫 배포
  # 어떤 이미지가 나갔는지는 태그 메시지의 ECR 이미지 URI 로 추적한다.
  tag:
    name: 운영 배포 태그
    needs: [deploy, build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 태그 생성·푸시
        run: |
          VER=$(node -p "require('./frontend/app.json').expo.version")
          BE=$(node -p "require('./backend/package.json').version")
          # PR 단계에서 막지만 보호 우회 머지로 들어왔을 수 있다 — 배포는 이미 끝났으므로 막지 않고 경고로 남긴다.
          # 태그는 기준(앱 버전)으로 붙인다. (workflow_dispatch 로 운영 배포하면 이 job 은 돌지 않아 태그가 없다)
          [ "$VER" = "$BE" ] || echo "::warning::버전 불일치 — 앱 $VER · 백엔드 $BE. 태그는 앱 버전 기준으로 붙인다"
          # 재실행(Re-run all jobs)으로 같은 커밋에 두 번째 태그가 붙지 않게 — 이미 이 버전 태그가 이 커밋에 있으면 끝낸다
          EXIST=$(git tag --points-at HEAD -l "v$VER" "v$VER+*" | head -1)
          if [ -n "$EXIST" ]; then echo "::notice::이 커밋에 이미 $EXIST 태그가 있다 — 건너뜀"; exit 0; fi
          if ! git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            TAG="v$VER"
          else
            # 개수가 아니라 **최댓값 + 1** — 중간 태그가 지워졌거나(+2 삭제) 부분 재실행이 있었으면 개수로는
            # 이미 있는 번호를 다시 만들어 tag 가 실패한다. 순번 없는 v$VER 는 1 로 친다.
            MAX=$(git tag -l "v$VER+*" | sed "s/^v$VER+//" | grep -E '^[0-9]+$' | sort -n | tail -1)
            TAG="v$VER+$(( ${MAX:-1} + 1 ))"
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "$TAG" -m "prod deploy $(date -u +%FT%TZ) · image ${{ needs.build-push.outputs.image }}"
          git push origin "$TAG"
          echo "::notice::tagged $TAG"
