name: deploy-api
# backend/ 변경을 검증하고, dev 에 머지되면 제품 API 서버(EC2)에 자동 배포한다 (backend/deploy/aws/README.md CI 장).
# 검증(verify)과 배포(deploy)를 job 으로 나눈다 — 검증이 실패하면 SG 개폐·SSH 자체가 일어나지 않는다.
# PR 에서는 검증만 돈다. AWS 접근은 OIDC 역할 ear-ci-deploy(SG 개폐 권한만) — 저장된 AWS 키 없음.
# SSH 는 CI 전용 키(secret CI_SSH_KEY_API). 1회 설정: bash backend/deploy/aws/setup-ci.sh

on:
  # 머지 전에 막는다 — push 만 있으면 이미 dev 에 들어온 뒤에야 안다.
  #
  # **paths 필터를 두지 않는다.** 필수 상태 체크로 걸려면 검증 job 이 **모든 PR 에서 결론을
  # 보고해야** 한다 — GitHub 은 실행되지 않은 필수 체크를 영원히 pending 으로 보므로, 필터를
  # 두면 FE·문서 PR 이 전부 머지 불가가 된다. 대신 job 안에서 백엔드 변경 여부를 판정해
  # 관계없는 PR 은 단계를 건너뛰고 성공으로 끝낸다 (tickets/infra 의 A 안).
  pull_request:
  push:
    branches: [dev]
    paths: ['backend/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  # dev push 는 종전대로 한 줄로 직렬화된다(같은 group). PR 은 ref 별로 갈라져 배포를 막지 않는다
  group: deploy-api-${{ github.event.pull_request.number || github.ref }}
  # 배포는 중간에 끊지 않는다. PR 검증만 새 커밋이 오면 앞선 런을 접는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 배포 전 관문 — lint·build·유닛·e2e. CI_SSH_KEY_API guard 와 무관하게 항상 돈다
  # (배포하지 않는 저장소에서도 테스트는 의미가 있다).
  #
  # **이 job 의 name 이 곧 필수 상태 체크 이름이다.** 바꾸면 dev 브랜치 보호의 체크 목록이
  # 끊어져 모든 PR 이 pending 에 걸린다 — 바꿀 때는 보호 설정도 같이 갱신할 것.
  verify:
    name: 검증 (lint · build · 유닛 · e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # 변경 파일 목록 조회(GET /pulls/{n}/files) 에만 쓴다
      pull-requests: read

    services:
      # 로컬 docker-compose.yml 과 같은 이미지 — 표준 postgres 에는 vector 확장이 없어
      # AddEmbeddingVectors 마이그레이션이 실패한다.
      # 값·포트는 .env.example 기본값에 맞춘다(그대로 복사해 쓰기 위해). 운영 DB 가 아니다.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ear
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: runtime
          TZ: UTC
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ear -d runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      # 판정보다 앞에 둔다 — defaults 의 working-directory(backend) 가 이 시점에 있어야 한다
      - uses: actions/checkout@v4

      # 트리거에서 뗀 paths 필터를 여기서 대신한다. 관계없는 PR 도 job 자체는 뜨고,
      # 아래 단계를 전부 건너뛴 채 **success 로 결론을 보고한다**.
      #
      # push·workflow_dispatch 는 판정하지 않는다 — push 트리거의 paths 필터가 이미
      # 걸러 주고, 여기서 false 가 나오면 needs: verify 인 배포 job 이 같이 죽는다.
      - name: 백엔드 변경 여부 판정
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          if printf '%s\n' "$FILES" | grep -qE '^(backend/|\.github/workflows/deploy-api\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ 변경이 없다 — 검증 단계를 건너뛰고 성공으로 보고한다"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.backend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 의존성 설치
        if: steps.scope.outputs.backend == 'true'
        run: npm ci

      # 운영 시크릿을 쓰지 않는다 — 예제의 더미 값으로 충분하다(AUDIO_DELIVERY=local,
      # MAIL_DELIVERY=logging 이라 외부 자원에 붙지 않는다). 예제를 그대로 복사해도
      # 기동되도록 맞춰 두었다(2026-09-08). 유닛 테스트도 env 를 읽으므로 앞에 둔다.
      - name: 테스트 env 준비 (.env.example 그대로)
        if: steps.scope.outputs.backend == 'true'
        run: cp .env.example .env

      - name: lint
        if: steps.scope.outputs.backend == 'true'
        run: npm run lint

      - name: build
        if: steps.scope.outputs.backend == 'true'
        run: npm run build

      - name: 유닛 테스트
        if: steps.scope.outputs.backend == 'true'
        run: npm test

      # 로컬과 같은 순서 — 스키마가 없으면 e2e 가 전부 깨진다
      - name: 마이그레이션
        if: steps.scope.outputs.backend == 'true'
        run: npm run migration:run

      - name: e2e 테스트
        if: steps.scope.outputs.backend == 'true'
        run: npm run test:e2e

  deploy:
    name: 배포 (EC2)
    # 검증을 통과했을 때만 배포한다
    needs: verify
    # PR 이벤트에서는 SG 개폐·SSH 가 일어나지 않는다. dev push·수동 실행에서만 배포한다
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      # 1회 설정(backend/deploy/aws/setup-ci.sh)이 아직이면 조용히 건너뛴다 —
      # 설정 전까지 모든 dev 머지가 빨간 X 로 남는 것을 막는다
      - name: 설정 여부 확인
        id: guard
        run: |
          if [ -z "${{ secrets.CI_SSH_KEY_API }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_SSH_KEY_API 가 없다 — 자동 배포가 아직 켜지지 않았다. bash backend/deploy/aws/setup-ci.sh 를 실행할 것"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - name: AWS 자격 (OIDC — dev 브랜치만 신뢰)
        if: steps.guard.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::639177726357:role/ear-ci-deploy
          aws-region: ap-northeast-2

      - name: SSH 개방 — 러너 IP 를 SG 에 잠깐 추가
        id: sg
        if: steps.guard.outputs.ready == 'true'
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id sg-048aaaf95e4d12b2e \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=\"github-actions deploy\"}]" \
            || echo "(이미 열려 있음)"

      - name: 배포 (push.sh — 서버 git pull + compose 빌드·재기동 + 헬스 확인)
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CI_SSH_KEY_API }}" > ~/.ssh/ci_deploy_api
          chmod 600 ~/.ssh/ci_deploy_api
          # REF 를 넘기지 않는다 — 러너가 체크아웃한 HEAD 를 그대로 뜬다
          PEM=~/.ssh/ci_deploy_api bash backend/deploy/push.sh

      - name: 실패 시 최근 로그 — 원인을 런에서 바로 본다
        if: failure()
        run: aws logs tail /ear/api --since 10m --format short || echo "(로그 조회 실패 — 역할에 logs 읽기 권한이 없다)"

      - name: SSH 폐쇄 — 러너 IP 제거 (배포 실패해도 실행)
        if: always() && steps.sg.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id sg-048aaaf95e4d12b2e \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.sg.outputs.ip }}/32}]" \
            || true
