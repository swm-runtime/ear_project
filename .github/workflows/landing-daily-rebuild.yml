name: landing-daily-rebuild
# 랜딩 페이지(Vercel)를 **이 워크플로만** 배포한다 — ① dev 에 랜딩 파일이 바뀌어 들어왔을 때 ② 매일 한 번 재빌드.
#
# Vercel 의 git 자동 배포는 꺼 뒀다(`landing-page/vercel.json` `git.deploymentEnabled: false`, 2026-10-08). 켜 두면
# 저장소 커밋마다(백엔드·앱 PR 까지) Vercel 이 배포를 하나씩 만들고 "빌드 건너뛰기"로 취소해, 하루 배포 한도에 걸렸다
# (2026-10-08 rate limited). 그래서 GitHub 가 랜딩 경로 변경일 때만 배포 훅을 부른다. 훅으로 시작한 빌드도
# `scripts/should-build.mjs`(ignoreCommand)를 탄다 — 랜딩이 바뀌었거나 굽는 주제 데이터가 바뀐 때만 실제로 빌드한다.
# PR 미리보기 배포는 없다(랜딩 확인은 로컬 `npm run dev` 또는 dev 머지 뒤 운영 주소).
#
# 랜딩은 정적 내보내기라 "고를 수 있는 주제" 섹션이 **빌드할 때** 백엔드 `GET /public/topics`
# (docs/spec/api/public-api.md)를 받아 HTML에 굽는다. 관리자 콘솔에서 주제를 공개·숨겨도
# 다시 빌드하기 전까지는 랜딩에 반영되지 않으므로, 하루 한 번 Vercel 배포 훅을 호출한다.
#
# 시각: 매일 05:30 KST — 0건 주제 자동 숨김(04:15)과 드립 편성(05:00) 뒤. 그날 공개 상태가 확정된 다음이다.
#
# 1회 설정: Vercel 프로젝트 Settings → Git → Deploy Hooks 에서 운영 브랜치용 훅을 만들고,
# 그 URL 을 repo secret LANDING_VERCEL_DEPLOY_HOOK 에 넣는다. 미설정이면 조용히 건너뛴다.

on:
  push:
    branches: [dev]
    paths:
      - 'landing-page/**'
  schedule:
    - cron: '30 20 * * *' # UTC 20:30 = KST 05:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vercel 배포 훅 호출
        env:
          HOOK: ${{ secrets.LANDING_VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "LANDING_VERCEL_DEPLOY_HOOK 미설정 — 재빌드를 건너뜁니다"
            exit 0
          fi
          # 훅 URL 자체가 비밀이라 출력하지 않는다
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "Vercel 응답: $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
