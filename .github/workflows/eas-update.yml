name: eas-update
# dev/main 에 frontend/ 변경이 머지되면 EAS Update(OTA)를 자동 발행한다.
# 팀원 누구의 merge든 동일하게 나간다 — 로컬 EAS CLI·로그인 불필요.
#   dev  → preview 채널 (내부 테스트 빌드가 수신) — 번들은 **개발계 API**(api-dev)를 본다 (KAN-65 결정 A, 2026-09-17)
#   main → production 채널 (스토어 빌드가 수신) — 번들은 운영 API 를 본다
# 네이티브 변경 안전장치는 runtimeVersion 이 맡는다 — 지문이 다른 (비호환) 빌드에는
# 업데이트가 전달되지 않으므로 매 merge 발행해도 안전하다. 네이티브가 바뀐 merge 는
# OTA 대신 새 빌드(eas build)가 필요하다는 뜻이기도 하다.
#
# 발행은 한 번 한다 — app.json 의 runtimeVersion 으로 android·ios 양쪽에 한꺼번에 닿는다.
# 1회 설정: repo secret EXPO_TOKEN (Expo access token)

on:
  push:
    branches: [dev, main]
    paths: ['frontend/**', '.github/workflows/eas-update.yml']
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # EXPO_TOKEN 미설정이면 조용히 건너뛴다 — 설정 전 merge 가 빨간 X 로 남는 것을 막는다
      - name: 설정 여부 확인
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN 미설정 — OTA 발행을 건너뜁니다"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 채널 결정
        if: steps.guard.outputs.run == 'true'
        id: channel
        run: |
          # 채널마다 보는 서버가 다르다 — preview 는 개발계, production 은 운영(KAN-65 결정 A).
          # eas.json 의 같은 프로필 env 와 반드시 같은 값을 유지한다(드리프트 시 OTA 번들만 다른 서버를 본다)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "api_base_url=https://api.earcast.co.kr/api/v1" >> "$GITHUB_OUTPUT"
            echo "app_variant=production" >> "$GITHUB_OUTPUT"
            # 운영은 결제 화면을 끈다(PM 2026-10-07) — 스토어 상품·서버 결제 키·유료 앱 계약 전. 준비되면 'on'
            echo "subscription_ui=off" >> "$GITHUB_OUTPUT"
            # 운영 Play 상품이 아직 없다(KAN-130) — eas.json production 도 'off'
            echo "subscription_android=off" >> "$GITHUB_OUTPUT"
          else
            echo "channel=preview" >> "$GITHUB_OUTPUT"
            echo "api_base_url=https://api-dev.earcast.co.kr/api/v1" >> "$GITHUB_OUTPUT"
            echo "app_variant=dev" >> "$GITHUB_OUTPUT"
            echo "subscription_ui=on" >> "$GITHUB_OUTPUT"
            # 개발계 Android 결제(KAN-155 코멘트 2026-10-08 — dev 앱 정기 결제·RTDN 연결 완료). eas.json preview 와 같은 값
            echo "subscription_android=on" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Node 설정
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: EAS CLI 설정
        if: steps.guard.outputs.run == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 의존성 설치
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: OTA 발행
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        env:
          # 번들에 박히는 값 — 채널 결정 단계가 정한다(preview=개발계 · production=운영).
          # mock 플래그(EXPO_PUBLIC_*_API 등)는 __DEV__ 가드라 릴리스 번들에선 값과 무관하다.
          EXPO_PUBLIC_API_BASE_URL: ${{ steps.channel.outputs.api_base_url }}
          # 앱 변형 — preview 채널은 개발계 앱(dev.runtime.ear)이 받는다(app.config.js · KAN-76).
          # OTA 매니페스트의 expoConfig(extra.socialAuth 등)가 이 값으로 정해진다 — 빌드 프로필 env 와 같아야 한다
          APP_VARIANT: ${{ steps.channel.outputs.app_variant }}
          # 크래시 리포트 DSN(KAN-92) — 번들의 expoConfig.extra 로 실린다. 시크릿 미설정이면 빈 값 → 앱은 수집을 끈다
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # 구독 UI(KAN-120) — 빌드 프로필 env 와 같은 값이어야 한다(preview 'on' · production 'off', 채널 결정 단계).
          # runtime 32 바이너리(expo-iap 포함)만 이 OTA 를 받고, 앱은 네이티브 모듈 유무도 다시 확인한다.
          # Android 결제는 EXPO_PUBLIC_SUBSCRIPTION_ANDROID 로 따로 켠다 — preview 'on'(2026-10-08) · production 'off'(KAN-130 전)
          EXPO_PUBLIC_SUBSCRIPTION_UI: ${{ steps.channel.outputs.subscription_ui }}
          EXPO_PUBLIC_SUBSCRIPTION_ANDROID: ${{ steps.channel.outputs.subscription_android }}
          # 커밋 메시지를 셸에 직접 보간하지 않는다 — 따옴표·개행이 섞여도 안전하게 env 로 받는다
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "${COMMIT_MESSAGE:-manual dispatch}" | head -n1)"
          eas update \
            --channel "${{ steps.channel.outputs.channel }}" \
            --message "$MESSAGE" \
            --non-interactive

      # OTA 번들의 소스맵을 Sentry 에 올린다(KAN-95) — 이게 없으면 OTA 에서 난 크래시 스택이 minified 로만 보인다.
      # **이 단계는 런을 죽이지 않는다.** 발행은 이미 끝났고(위 단계), 소스맵은 사후 편의다 — 여기서 실패시키면
      # 실제로 나간 OTA 가 빨간 런으로 남아 진짜 실패와 구분되지 않는다(2026-09-28: 토큰이 등록되자 sentry-cli 가
      # exit 1 로 죽어 런이 실패로 표시됐다). 실패는 경고로 남기고 사유를 로그에 그대로 뽑는다.
      # 등록은 사람 손: GitHub secret SENTRY_AUTH_TOKEN(EAS 와 같은 값) · slug 는 app.json 플러그인(runtime-gw/ear-app)
      - name: Sentry 소스맵 업로드
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # sentry-cli 가 조용히 죽는 것을 막는다 — 실패 사유(권한·slug·네트워크)가 로그에 찍혀야 사람이 고칠 수 있다
          SENTRY_LOG_LEVEL: info
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN 이 없다 — 소스맵 업로드를 건너뛴다(스택이 minified 로 보인다). GitHub secret 에 EAS 와 같은 토큰을 등록한다"
            exit 0
          fi
          if ! npx sentry-expo-upload-sourcemaps dist; then
            echo "::warning::소스맵 업로드 실패 — OTA 발행은 끝났다. 위 로그의 sentry-cli 사유를 본다(토큰 스코프 project:releases · org/project slug)"
          fi
